# Dependabot version updates, all against `dev` (the integration branch). Security updates are not delayed by the
# groups below: every group has `applies-to: version-updates`, so a security fix gets its own immediate PR.
# Each ecosystem has one group for all minor and patch updates (one weekly PR); a major update is not in any
# group and stays its own PR, so a breaking change is reviewed alone.
#
# Labels must exist in the repository, or Dependabot skips them: create `dependencies`, `nuget`, `github-actions`,
# `dotnet-sdk` and `velopack` once.
version: 2

# Velopack (NuGet) and vpk (dotnet tool) must have the same version, so they move in one PR across both
# ecosystems. Only the entries below that name `multi-ecosystem-group: velopack` join it.
multi-ecosystem-groups:
  velopack:
    schedule:
      interval: weekly
    target-branch: dev
    labels:
      - dependencies
      - velopack
    commit-message:
      prefix: Bump

updates:
  # NuGet packages, including the transitive pins, from central package management.
  - package-ecosystem: nuget
    directory: /src/NexGrades
    target-branch: dev
    schedule:
      interval: weekly
    # Joins the velopack group for the Velopack package only (the vpk tool below is the other half).
    multi-ecosystem-group: velopack
    patterns:
      - Velopack
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    commit-message:
      prefix: Bump
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Must equal the Aspire.AppHost.Sdk version in NexGrades.AppHost.csproj, which Dependabot does not update.
      # Move both by hand (see Directory.Packages.props).
      - dependency-name: Aspire.Hosting.AppHost

  # Local dotnet tools in .config/dotnet-tools.json (only vpk), read by the nuget ecosystem.
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    multi-ecosystem-group: velopack
    patterns:
      - vpk

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: Bump
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # SDK version in global.json.
  - package-ecosystem: dotnet-sdk
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - dotnet-sdk
    commit-message:
      prefix: Bump
    groups:
      sdk-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
