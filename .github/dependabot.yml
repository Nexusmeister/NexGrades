# Dependabot version updates, all against `dev` (the integration branch). Each entry sets target-branch and
# open-pull-requests-limit itself. The nuget-minor-patch, velopack, actions-minor-patch and sdk-minor-patch groups have
# `applies-to: version-updates`, so a security update is not held back by them and gets its own immediate PR.
# Each ecosystem has one group for minor and patch updates (one weekly PR), except the vpk entry (the second nuget
# entry, for /), which has no group, and NuGet, which has a second group `velopack`. A major update is not in any group
# and stays its own PR, so a breaking change is reviewed alone.
#
# Velopack (NuGet) and vpk (dotnet tool) must have the same version, but they now arrive as separate PRs: the Velopack
# package in the `velopack` group of the NuGet entry, vpk in its own entry. New-ReleaseAsset.ps1 fails the PR build when
# the two differ, so add the matching bump by hand to whichever PR arrives first. The manual bump touches
# `.config/dotnet-tools.json` (vpk) and `src/NexGrades/Directory.Packages.props` (Velopack). Dependabot stops rebasing
# a branch someone pushed to, so close the other PR by hand.
# Dependabot labels groups by the entry, so the Velopack package PR arrives labelled `dependencies` and `nuget` (not
# `velopack`); only the vpk PR carries `velopack`.
#
# Labels must exist in the repository, or Dependabot skips them: create `dependencies`, `nuget`, `github-actions`,
# `dotnet-sdk` and `velopack` once.
version: 2

updates:
  # NuGet packages, including the transitive pins, from central package management.
  - package-ecosystem: nuget
    directory: /src/NexGrades
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "Velopack*"
      velopack:
        applies-to: version-updates
        patterns:
          - "Velopack*"
        update-types:
          - minor
          - patch
    ignore:
      # Aspire.Hosting.AppHost, Aspire.Hosting.Dotnet and CommunityToolkit.Aspire.Hosting.Sqlite must be raised together
      # by hand in src/NexGrades/Directory.Packages.props, because a Dependabot bump of one alone can leave
      # Aspire.Hosting versions mismatched (even minor/patch).
      - dependency-name: Aspire.Hosting.AppHost
      - dependency-name: Aspire.Hosting.Dotnet
      - dependency-name: CommunityToolkit.Aspire.Hosting.Sqlite

  # Local dotnet tools in .config/dotnet-tools.json (only vpk), read by the nuget ecosystem.
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - velopack

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # SDK version in global.json.
  - package-ecosystem: dotnet-sdk
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - dotnet-sdk
    groups:
      sdk-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
