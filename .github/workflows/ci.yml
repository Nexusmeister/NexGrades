name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  # Every branch, including main and dev (the release jobs below filter by ref themselves), but not tag pushes.
  push:
    branches: ['**']

  pull_request:
    branches:
      - main
      - dev

env:
  DOTNET_VERSION: 10.x.x
  # The release notes; the create steps replace <version> with the version of the release.
  SMARTSCREEN_NOTE: |
    **Install:** download `NexGrades-<version>-win-x64-Setup.exe` and run it. It installs NexGrades for your Windows
    user account; no administrator rights are needed. Alternatively, unzip `NexGrades-<version>-win-x64-Portable.zip`
    to a folder of your own and start NexGrades from there. Both update themselves. The other files are the update
    feed; you don't need to download them.

    Uninstalling NexGrades keeps your data in `%LOCALAPPDATA%\NexGrades`.

    NexGrades is not code-signed yet, so Windows SmartScreen may warn when you start the installer or the app for the
    first time. Choose **More info**, then **Run anyway**.
    The version is taken from the git tag; see docs/releasing.md.

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./src/NexGrades
    steps:
      # Full history: MinVer derives the version from git tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore
      # Zero-warning policy: any compiler or analyzer warning fails the build (also enforced by
      # TreatWarningsAsErrors in Directory.Build.props when CI=true; -warnaserror makes it explicit).
      - name: Test
        run: dotnet test --verbosity normal -warnaserror

  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./src/NexGrades
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore
      # Zero-warning policy: build the whole solution (AppHost, ServiceDefaults and test projects
      # included) so every project is analyzed, and fail on any warning.
      - name: Build
        run: dotnet build NexGrades.slnx --no-restore -warnaserror
      # Formatting follows .editorconfig; CI fails on any file dotnet format would change.
      - name: Verify formatting
        run: dotnet format NexGrades.slnx --verify-no-changes --no-restore
      # Pull requests build the beta release assets without uploading anything, so a packaging problem fails the
      # pull request instead of the next beta. As in the release jobs, beta tags are dropped from this runner's clone
      # only, so MinVer yields X.Y.Z-beta.<height>, the version the beta channel requires.
      - name: Package (dry run)
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: pwsh
        run: |
          git tag --list 'v*-beta.*' | ForEach-Object { git tag -d $_ }
          ./.github/scripts/New-ReleaseAsset.ps1 -OutputDirectory "$env:RUNNER_TEMP/release" -Channel beta

  # Every push to dev publishes a GitHub pre-release, e.g. v0.1.1-beta.4. Only the 10 newest are kept.
  release-beta:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: windows-latest
    permissions:
      contents: write
    # Own group per channel, so a slow beta never delays a stable release and vice versa.
    concurrency:
      group: release-beta
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
      BETAS_TO_KEEP: 10
    steps:
      # Full history and tags: MinVer derives the version from them. The token is not persisted; every step
      # that talks to GitHub gets GH_TOKEN itself, and git only reads (the public repo fetches unauthenticated).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Beta tags (v0.1.1-beta.4) are real tags with the v prefix, so MinVer would pick the newest one as its base
      # and yield 0.1.1-beta.4.1. Dropping them from this runner's clone only (nothing is pushed) leaves the stable
      # tags: version = latest stable + 1 patch, -beta.<height since that stable tag>.
      - name: Ignore beta tags
        shell: pwsh
        run: |
          git tag --list 'v*-beta.*' | ForEach-Object { git tag -d $_ }
      # A stable tag on the dev tip (e.g. after merging main back) makes MinVer yield a version without pre-release
      # part. That commit is already released from main; there is no beta to publish.
      - name: Check for a stable tag
        id: check
        shell: pwsh
        run: |
          $stableTags = @(git tag --points-at $env:RELEASE_SHA | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
          if ($stableTags.Count -gt 0) {
            Write-Host "::notice::dev tip carries the stable tag $($stableTags -join ', '); no beta published."
            "build=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "build=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Publish and pack
        if: steps.check.outputs.build == 'true'
        id: asset
        shell: pwsh
        run: ./.github/scripts/New-ReleaseAsset.ps1 -OutputDirectory "$env:RUNNER_TEMP/release" -Channel beta
      # The release is created as a draft with all assets and only then published, so a partly uploaded release is
      # never visible to users or to installed apps looking for updates.
      - name: Create pre-release
        if: steps.check.outputs.build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.asset.outputs.version }}
          ASSETS_DIR: ${{ steps.asset.outputs.assets_dir }}
        run: |
          $tag = "v$env:VERSION"
          if ($tag -notmatch '^v\d+\.\d+\.\d+-beta\.\d+$') { throw "Unexpected beta version '$tag'." }

          # A re-run of the same commit finds its release already there. A draft is left over from a run that failed
          # before publishing; it is replaced. A draft has no tag yet, so there is no tag to clean up.
          $isDraft = gh release view $tag --json isDraft --jq '.isDraft' 2> $null
          if ($LASTEXITCODE -eq 0) {
            if ($isDraft -ne 'true') {
              Write-Host "Release $tag already exists; nothing to create."
              exit 0
            }
            Write-Host "Deleting the unpublished draft of $tag."
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not delete the draft of $tag." }
          }
          $global:LASTEXITCODE = 0

          $files = @(Get-ChildItem -LiteralPath $env:ASSETS_DIR -File | ForEach-Object FullName)
          if ($files.Count -eq 0) { throw "No release assets in $env:ASSETS_DIR." }
          gh release create $tag @files --draft --prerelease --latest=false --target $env:RELEASE_SHA `
            --title "NexGrades $env:VERSION" --generate-notes --notes ($env:SMARTSCREEN_NOTE.Replace('<version>', $env:VERSION))
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed.' }
          gh release edit $tag --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the draft failed.' }
      # Retention: only published releases that are pre-releases AND named v*-beta.* are ever considered, so stable
      # releases and their tags are never touched, and neither are drafts (the next run of a draft's version replaces
      # it). Newest by publish date win; the release of this run always counts among the kept ones. Deleting a release
      # deletes all its assets (Setup, Portable and feed files).
      - name: Delete old betas
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.asset.outputs.version }}
        run: |
          $json = gh release list --limit 200 --json tagName,isPrerelease,isDraft,publishedAt
          if ($LASTEXITCODE -ne 0) { throw 'gh release list failed.' }
          $all = ConvertFrom-Json $json
          $betas = @(@($all) |
            Where-Object { $_.isPrerelease -and -not $_.isDraft -and $_.tagName -match '^v\d+\.\d+\.\d+-beta\.\d+$' })
          $current = "v$env:VERSION"
          $keep = [int]$env:BETAS_TO_KEEP
          $others = @($betas | Where-Object { $_.tagName -ne $current } | Sort-Object { [datetime]$_.publishedAt } -Descending)
          if (@($betas | Where-Object { $_.tagName -eq $current }).Count -gt 0) { $keep-- }
          $old = @($others | Select-Object -Skip $keep)
          Write-Host "Beta pre-releases: $($betas.Count); deleting: $($old.Count)"
          foreach ($r in $old) {
            Write-Host "Deleting $($r.tagName)"
            gh release delete $r.tagName --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not delete $($r.tagName)." }
          }

  # Every push to main publishes the next patch version as a stable release (v0.1.0 -> v0.1.1). Minor and major
  # bumps are tags the owner pushes by hand; see docs/releasing.md.
  release-stable:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: release-stable
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      # Token not persisted; see the beta job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Decide the version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the tip of main is ever released. A re-run or a late run of an older push would otherwise
          # publish older code under a higher version number.
          $tip = (git ls-remote origin refs/heads/main) -split '\s+' | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or -not $tip) { throw 'git ls-remote failed.' }
          if ($tip -ne $env:RELEASE_SHA) {
            Write-Host "::notice::$env:RELEASE_SHA is no longer the tip of main; the newer push releases instead."
            "build=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) { throw 'git fetch --tags failed.' }

          # Beta tags (v0.1.1-beta.3) would make MinVer build on them; drop them from this clone (nothing is pushed).
          git tag --list 'v*-beta.*' | ForEach-Object { git tag -d $_ }

          # Stable tags (vX.Y.Z) reachable from this commit only; tags on other branches or later commits do not count.
          $stable = @(git tag --list 'v[0-9]*' --merged $env:RELEASE_SHA |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Substring(1) })
          $onHead = @(git tag --points-at $env:RELEASE_SHA | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })

          if ($onHead.Count -gt 0) {
            # The owner pushed a tag together with this commit: release exactly that version.
            $tag = $onHead | Sort-Object { [version]$_.Substring(1) } | Select-Object -Last 1
            $createTag = 'false'
          } elseif ($stable.Count -eq 0) {
            $tag = 'v0.1.0'
            $createTag = 'true'
          } else {
            $latest = [version]($stable | Select-Object -Last 1).Substring(1)
            $tag = "v$($latest.Major).$($latest.Minor).$($latest.Build + 1)"
            $createTag = 'true'
          }
          $startTag = if ($stable.Count -gt 0) { ($stable | Where-Object { $_ -ne $tag } | Select-Object -Last 1) } else { '' }

          # A draft is left over from a run that failed before publishing. It counts as not released; the create step
          # replaces it.
          $isDraft = gh release view $tag --json isDraft --jq '.isDraft' 2> $null
          $exists = if ($LASTEXITCODE -eq 0 -and $isDraft -ne 'true') { 'true' } else { 'false' }
          $global:LASTEXITCODE = 0
          $build = if ($exists -eq 'true') { 'false' } else { 'true' }

          Write-Host "Tag: $tag (create tag: $createTag, release exists: $exists, notes start: $startTag)"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "create_tag=$createTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build=$build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "start_tag=$startTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      # The tag must exist locally at this commit before publishing, so MinVer yields the plain X.Y.Z. It is
      # created on GitHub by `gh release create --target` below, only after the asset was built successfully.
      - name: Tag locally
        if: steps.version.outputs.build == 'true' && steps.version.outputs.create_tag == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag $env:TAG $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'git tag failed.' }
      - name: Publish and pack
        if: steps.version.outputs.build == 'true'
        id: asset
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $expected = $env:TAG.Substring(1)
          ./.github/scripts/New-ReleaseAsset.ps1 -OutputDirectory "$env:RUNNER_TEMP/release" -Channel stable -ExpectedVersion $expected
      # Created as a draft with all assets and only then published as the latest release, so a partly uploaded
      # release is never visible. Installed stable apps read their feed from releases/latest/download/, so the latest
      # release must always be a complete one.
      - name: Create release
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          START_TAG: ${{ steps.version.outputs.start_tag }}
          VERSION: ${{ steps.asset.outputs.version }}
          ASSETS_DIR: ${{ steps.asset.outputs.assets_dir }}
        run: |
          # Only a stale draft can be here ('Decide the version' skips published releases). Without --cleanup-tag,
          # deleting it leaves every tag alone, including a tag pushed by hand. Published stable releases are never
          # deleted.
          $isDraft = gh release view $env:TAG --json isDraft --jq '.isDraft' 2> $null
          if ($LASTEXITCODE -eq 0) {
            if ($isDraft -ne 'true') { throw "Release $env:TAG is already published." }
            Write-Host "Deleting the unpublished draft of $env:TAG."
            gh release delete $env:TAG --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not delete the draft of $env:TAG." }
          }
          $global:LASTEXITCODE = 0

          $files = @(Get-ChildItem -LiteralPath $env:ASSETS_DIR -File | ForEach-Object FullName)
          if ($files.Count -eq 0) { throw "No release assets in $env:ASSETS_DIR." }
          $ghArgs = @($env:TAG) + $files + @('--draft', '--target', $env:RELEASE_SHA,
            '--title', "NexGrades $env:VERSION", '--generate-notes', '--notes', $env:SMARTSCREEN_NOTE.Replace('<version>', $env:VERSION))
          if ($env:START_TAG) { $ghArgs += @('--notes-start-tag', $env:START_TAG) }
          gh release create @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed.' }
          gh release edit $env:TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the draft failed.' }
