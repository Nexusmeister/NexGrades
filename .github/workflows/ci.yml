name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  # Not on master
  push:
    branches-ignore:
      - main

  pull_request:
    branches:
      - main
      - dev

env:
  DOTNET_VERSION: 10.x.x

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./src/NexGrades
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore
      # Zero-warning policy: any compiler or analyzer warning fails the build (also enforced by
      # TreatWarningsAsErrors in Directory.Build.props when CI=true; -warnaserror makes it explicit).
      - name: Test
        run: dotnet test --verbosity normal -warnaserror

  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./src/NexGrades
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore
      # Zero-warning policy: build the whole solution (AppHost, ServiceDefaults and test projects
      # included) so every project is analyzed, and fail on any warning.
      - name: Build
        run: dotnet build NexGrades.slnx --no-restore -warnaserror